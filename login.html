<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دخول الأدمن | دليل السودان الشامل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:'IBM Plex Sans Arabic',Arial,sans-serif;color:#183b2e;background:#f3f7f4}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.login{width:min(100%,460px);background:#fff;border:1px solid #dfe9e2;border-radius:18px;padding:28px;box-shadow:0 10px 32px #143f2610}h1{font-size:26px;margin:0 0 22px}label{display:block;margin:14px 0 5px;font-weight:600}input{width:100%;padding:13px;border:1px solid #cddbd2;border-radius:10px;font:inherit}input:focus{outline:2px solid #39a06d}button{border:0;border-radius:10px;background:#087348;color:#fff;padding:12px 22px;font:inherit;font-weight:700;cursor:pointer;margin-top:18px}button:disabled{opacity:.6;cursor:wait}.message{margin-top:14px;color:#a3332c;line-height:1.6}
</style>
</head>
<body>
<main class="login">
<h1>دخول الأدمن</h1>
<form id="loginForm">
<label for="email">البريد الإلكتروني</label>
<input id="email" type="email" value="melnaeema@gmail.com" autocomplete="username" required>
<label for="password">كلمة المرور</label>
<input id="password" type="password" autocomplete="current-password" required>
<button id="loginBtn" type="submit">دخول</button>
</form>
<div class="message" id="message" aria-live="polite"></div>
</main>
<script>
const sb=window.supabase.createClient("https://ajcioetohfbrgaihbncv.supabase.co","sb_publishable_Zs8iWbXjSnK6Q91SUq6R-A_-gpl0nBt");
const form=document.getElementById("loginForm"),button=document.getElementById("loginBtn"),message=document.getElementById("message");
async function verifyAdmin(user){const {data,error}=await sb.from("sd_directory_admins").select("user_id").eq("user_id",user.id).maybeSingle();return !error&&!!data;}
form.addEventListener("submit",async event=>{event.preventDefault();button.disabled=true;message.textContent="";const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});if(error||!data.user){button.disabled=false;message.textContent="تعذر الدخول. تحقق من البريد وكلمة المرور.";return;}if(!await verifyAdmin(data.user)){await sb.auth.signOut();button.disabled=false;message.textContent="هذا الحساب غير مخوّل بدخول لوحة الأدمن.";return;}location.replace("./admin.html");});
(async()=>{const {data}=await sb.auth.getSession();if(data.session?.user&&await verifyAdmin(data.session.user))location.replace("./admin.html");})();
</script>
</body>
</html>
