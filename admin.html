<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مراجعة الدليل | Sudan National Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:'IBM Plex Sans Arabic',Inter,Arial,sans-serif;color:#183b2e;background:#f3f7f4;font-synthesis:none}
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}
header{background:linear-gradient(120deg,#075c40,#16815a);color:#fff;padding:24px 18px 42px}
.top{max-width:1050px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.top a{color:#fff}.brand{font-size:20px;font-weight:700}.actions{display:flex;gap:8px;align-items:center}
.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:600}.light{background:#fff;color:#075c40}.outline{background:transparent;border:1px solid #ffffff9e;color:#fff}
main{max-width:1050px;margin:-20px auto 40px;padding:0 16px}
.panel,.card{background:#fff;border:1px solid #dfe9e2;border-radius:18px;padding:22px;box-shadow:0 8px 26px #143f2610}
.auth{max-width:540px;margin:0 auto}.auth p,.muted{color:#63776b;line-height:1.75}.auth input{width:100%;padding:13px;border:1px solid #cddbd2;border-radius:10px;margin:8px 0 12px}
h1{font-size:clamp(26px,4vw,38px);margin:18px 0 6px}.title p{margin:0;color:#e1f2e8}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:24px 0 12px}.toolbar h2{margin:0;font-size:21px}.count{font-weight:600;color:#176a49}
.cards{display:grid;gap:14px}.card{padding:20px}.badge{display:inline-block;background:#e5f5eb;color:#116744;border-radius:999px;padding:5px 11px;font-size:14px}
.card h3{font-size:23px;margin:12px 0}.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px;color:#50685a;line-height:1.6}.detail strong{color:#29483a}
.refs{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.refs a{color:#087348;font-weight:700;overflow-wrap:anywhere}
.photo{max-width:100%;max-height:300px;border-radius:12px;object-fit:contain;background:#f3f6f4;margin:10px 0}
.review{border-top:1px solid #e5ece7;padding-top:15px;margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.review label{font-weight:600}.review select,.review textarea{display:block;width:100%;margin-top:6px;border:1px solid #ceddd3;border-radius:9px;padding:10px;background:#fff;color:#183b2e}.review textarea{min-height:68px;resize:vertical}
.check{display:flex;gap:9px;align-items:flex-start;line-height:1.55;grid-column:1/-1}.check input{margin-top:7px;width:18px;height:18px;flex:none}
.cardActions{display:flex;gap:9px;flex-wrap:wrap;grid-column:1/-1}.approve{background:#087348;color:#fff}.reject{background:#fff0ef;color:#9b3028}.message{padding:12px 15px;border-radius:10px;margin:12px 0;line-height:1.6}.error{background:#fff0ef;color:#8d2e27}.success{background:#e7f6eb;color:#175a3d}.empty{text-align:center;padding:42px 16px;color:#64776c;background:#fff;border-radius:16px}
.hidden{display:none!important}footer{text-align:center;padding:20px;color:#748278;font-size:14px}
@media(max-width:650px){.details,.review{grid-template-columns:1fr}.toolbar{align-items:flex-start;flex-direction:column}.top{align-items:flex-start}.brand{max-width:210px}.card h3{font-size:21px}}
</style>
</head>
<body>
<header><div class="top"><a class="brand" href="./">🇸🇩 دليل السودان الشامل</a><div class="actions"><button class="btn outline" id="langBtn" type="button">English</button><button class="btn light hidden" id="signOut" type="button">تسجيل الخروج</button></div></div><div class="title" style="max-width:1050px;margin:22px auto 0;padding:0 16px"><h1 id="pageTitle">مراجعة اقتراحات الدليل</h1><p id="subtitle">تأكد من المصدر وحالة التشغيل كلٌّ على حدة قبل النشر.</p></div></header>
<main>
<section id="authPanel" class="panel auth">
<h2 id="loginTitle">دخول المراجع</h2><p id="loginHelp">أرسل رابط دخول آمن إلى بريد المراجع المسجّل. لا نطلب كلمة مرور على هذه الصفحة.</p>
<form id="loginForm"><label id="emailLabel" for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" value="melnaeema@gmail.com" required><button class="btn approve" id="loginBtn" type="submit">إرسال رابط الدخول</button></form>
<div id="authMessage" aria-live="polite"></div>
</section>
<section id="queuePanel" class="hidden">
<div class="toolbar"><h2 id="queueTitle">الاقتراحات بانتظار المراجعة</h2><span class="count" id="queueCount"></span></div>
<div id="pageMessage" aria-live="polite"></div>
<div class="cards" id="queue"></div>
</section>
</main>
<footer>© <span id="year"></span> دليل السودان الشامل</footer>
<script>
const SUPABASE_URL="https://ajcioetohfbrgaihbncv.supabase.co";
const SUPABASE_KEY="sb_publishable_Zs8iWbXjSnK6Q91SUq6R-A_-gpl0nBt";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let lang="ar", queueRows=[], categories=new Map(), signedUser=null;
const el=id=>document.getElementById(id);
const t={
ar:{loginTitle:"دخول المراجع",loginHelp:"أرسل رابط دخول آمن إلى بريد المراجع المسجّل. لا نطلب كلمة مرور على هذه الصفحة.",email:"البريد الإلكتروني",send:"إرسال رابط الدخول",sent:"تم إرسال رابط الدخول. افتح بريدك واستخدم الرابط على هذا الموقع.",queue:"الاقتراحات بانتظار المراجعة",loading:"جارٍ تحميل قائمة المراجعة…",none:"لا توجد اقتراحات معلّقة حاليًا.",unauthorized:"هذا الحساب غير مخوّل بمراجعة الدليل.",signed:"تم تسجيل الدخول.",logout:"تسجيل الخروج",source:"المصدر",map:"Google Maps",photoSource:"مصدر الصورة",credit:"صاحب/حقوق الصورة",submitter:"المرسل",contact:"تواصل المرسل",state:"الولاية",locality:"المحلية/المدينة",address:"العنوان",phone:"الهاتف",whatsapp:"واتساب",website:"الموقع الإلكتروني",hours:"ساعات العمل",category:"الدليل",type:"نوع المنشأة",sourceCheck:"راجعت مصدر المعلومات، وتأكدت من صحة البيانات الأساسية. عند التأكيد الهاتفي اكتب التفاصيل في ملاحظة المراجع.",sourceRequired:"يلزم فحص المصدر قبل النشر. إذا كان التحقق هاتفيًا أو مباشرًا، دوّن ذلك في الملاحظة.",operation:"حالة التشغيل (قرار مستقل عن فحص المصدر)",unknown:"غير مؤكدة",open:"تعمل",temp:"مغلقة مؤقتًا",closed:"مغلقة",note:"ملاحظة المراجع / سبب الرفض",approve:"اعتماد ونشر",reject:"رفض الاقتراح",working:"جارٍ الحفظ…",approved:"تم اعتماد الاقتراح ونشر السجل.",rejected:"تم رفض الاقتراح.",error:"تعذر إتمام العملية. راجع الحقول والصلاحيات ثم أعد المحاولة.",count:"اقتراح قيد المراجعة",loginError:"تعذر إرسال رابط الدخول.",photoRights:"حقوق نشر الصورة غير مؤكدة",loginExpired:"انتهت الجلسة. سجّل الدخول مجددًا.",sourceNone:"لا يوجد رابط مصدر؛ أضف ملاحظة توضح طريقة التحقق."},
en:{loginTitle:"Reviewer sign in",loginHelp:"Send a secure sign-in link to the registered reviewer email. This page never asks for a password.",email:"Email address",send:"Send sign-in link",sent:"Sign-in link sent. Open your email and use the link on this site.",queue:"Suggestions awaiting review",loading:"Loading review queue…",none:"There are no pending suggestions.",unauthorized:"This account is not authorized to review the directory.",signed:"Signed in.",logout:"Sign out",source:"Information source",map:"Google Maps",photoSource:"Photo source",credit:"Photo credit / rights",submitter:"Submitted by",contact:"Submitter contact",state:"State",locality:"Locality / city",address:"Address",phone:"Phone",whatsapp:"WhatsApp",website:"Website",hours:"Opening hours",category:"Directory",type:"Facility type",sourceCheck:"I reviewed the information source and checked the key details. For phone or direct confirmation, record details in the reviewer note.",sourceRequired:"Source review is required before publishing. For phone or direct confirmation, record it in the reviewer note.",operation:"Operating status (separate from source review)",unknown:"Unconfirmed",open:"Open",temp:"Temporarily closed",closed:"Closed",note:"Reviewer note / rejection reason",approve:"Approve and publish",reject:"Reject suggestion",working:"Saving…",approved:"Suggestion approved and listing published.",rejected:"Suggestion rejected.",error:"Could not complete this action. Check the fields and access, then retry.",count:"suggestion pending",loginError:"Could not send the sign-in link.",photoRights:"Photo publication rights are not confirmed",loginExpired:"Your session expired. Please sign in again.",sourceNone:"No source URL is provided; add a note explaining how it was checked."}
};
const tr=k=>t[lang][k]||k;
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function safeUrl(v){try{const u=new URL(v);return ["https:","http:"].includes(u.protocol)?u.href:"";}catch{return "";}}
function textLink(label,url){const u=safeUrl(url);return u?'<a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+esc(label)+'</a>':"";}
function applyLang(){document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";el("langBtn").textContent=lang==="ar"?"English":"العربية";el("pageTitle").textContent=lang==="ar"?"مراجعة اقتراحات الدليل":"Review directory suggestions";el("subtitle").textContent=lang==="ar"?"تأكد من المصدر وحالة التشغيل كلٌّ على حدة قبل النشر.":"Check the information source and operating status separately before publication.";el("loginTitle").textContent=tr("loginTitle");el("loginHelp").textContent=tr("loginHelp");el("emailLabel").textContent=tr("email");el("loginBtn").textContent=tr("send");el("queueTitle").textContent=tr("queue");el("signOut").textContent=tr("logout");renderQueue();}
el("langBtn").addEventListener("click",()=>{lang=lang==="ar"?"en":"ar";applyLang();});
el("year").textContent=new Date().getFullYear();
el("loginForm").addEventListener("submit",async ev=>{ev.preventDefault();el("loginBtn").disabled=true;const email=el("email").value.trim();const redirect=location.origin+location.pathname;const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:redirect,shouldCreateUser:false}});el("loginBtn").disabled=false;el("authMessage").className="message "+(error?"error":"success");el("authMessage").textContent=error?(tr("loginError")+" "+error.message):tr("sent");});
el("signOut").addEventListener("click",async()=>{await sb.auth.signOut();location.reload();});
sb.auth.onAuthStateChange((_event,session)=>{if(session?.user){setTimeout(()=>enterReviewer(session.user),0);}else{signedUser=null;el("authPanel").classList.remove("hidden");el("queuePanel").classList.add("hidden");el("signOut").classList.add("hidden");}});
async function enterReviewer(user){if(signedUser===user.id)return;signedUser=user.id;const {data,error}=await sb.from("sd_directory_admins").select("user_id").eq("user_id",user.id).maybeSingle();if(error||!data){signedUser=null;el("authPanel").classList.remove("hidden");el("authMessage").className="message error";el("authMessage").textContent=tr("unauthorized");await sb.auth.signOut();return;}el("authPanel").classList.add("hidden");el("queuePanel").classList.remove("hidden");el("signOut").classList.remove("hidden");showMessage(tr("loading"));await loadQueue();}
function showMessage(message,kind=""){el("pageMessage").className=kind?"message "+kind:"";el("pageMessage").textContent=message;}
async function loadQueue(){const [cats,sugs]=await Promise.all([sb.from("sd_categories").select("*"),sb.from("sd_listing_suggestions").select("*").eq("status","pending").order("created_at",{ascending:true})]);if(cats.error||sugs.error){showMessage(tr("error"),"error");return;}categories=new Map((cats.data||[]).map(c=>[String(c.id),c]));queueRows=sugs.data||[];el("queueCount").textContent=queueRows.length+" "+tr("count");showMessage("");renderQueue();}
function valLabel(k,v){return '<div class="detail"><strong>'+esc(tr(k))+':</strong> <span>'+esc(v||"—")+'</span></div>';}
function categoryName(id){const c=categories.get(String(id));if(!c)return id||"—";return lang==="en"?(c.name_en||c.name_ar):(c.name_ar||c.name_en);}
function renderQueue(){if(!el("queue")||el("queuePanel").classList.contains("hidden"))return;el("queue").innerHTML="";if(!queueRows.length){el("queue").innerHTML='<div class="empty">'+esc(tr("none"))+'</div>';el("queueCount").textContent="0 "+tr("count");return;}el("queue").innerHTML=queueRows.map(s=>{const image=safeUrl(s.image_url);const status=s.operating_status||"unknown";const options=[["unknown",tr("unknown")],["open",tr("open")],["temporarily_closed",tr("temp")],["closed",tr("closed")]].map(([v,l])=>'<option value="'+v+'" '+(v===status?"selected":"")+'>'+esc(l)+'</option>').join("");const img=image?'<img class="photo" src="'+esc(image)+'" alt="'+esc(s.name_ar)+'">':"";const rights=s.image_url&&!s.image_rights_confirmed?'<p class="message error">'+esc(tr("photoRights"))+'</p>':"";const sourceLinks=textLink(tr("source"),s.source_url)+textLink(tr("map"),s.map_url)+textLink(tr("website"),s.website_url)+textLink(tr("photoSource"),s.image_source_url);return '<article class="card" data-id="'+esc(s.id)+'"><span class="badge">'+esc(categoryName(s.category_id))+'</span><h3>'+esc(s.name_ar)+(lang==="en"&&s.name_en?" <small>("+esc(s.name_en)+")</small>":"")+'</h3><div class="details">'+valLabel("type",s.facility_type_ar)+valLabel("state",s.state_ar)+valLabel("locality",s.locality_ar+(s.locality_en?" / "+s.locality_en:""))+valLabel("address",s.address_ar)+valLabel("phone",s.phone_public)+valLabel("whatsapp",s.whatsapp_public)+valLabel("website",s.website_url)+valLabel("hours",s.working_hours)+valLabel("submitter",s.submitter_name)+valLabel("contact",s.submitter_contact)+valLabel("credit",s.image_credit)+'</div>'+img+rights+'<div class="refs">'+sourceLinks+'</div><div class="review"><label class="check"><input class="sourceChecked" type="checkbox"><span>'+esc(tr("sourceCheck"))+'</span></label><label>'+esc(tr("operation"))+'<select class="operation">'+options+'</select></label><label style="grid-column:1/-1">'+esc(tr("note"))+'<textarea class="reviewNote" placeholder="'+esc(s.source_url?"":"")+'"></textarea></label><div class="cardActions"><button class="btn approve approveBtn" type="button">'+esc(tr("approve"))+'</button><button class="btn reject rejectBtn" type="button">'+esc(tr("reject"))+'</button></div></div></article>';}).join("");el("queue").querySelectorAll(".approveBtn").forEach(b=>b.addEventListener("click",()=>review(b.closest(".card"),"approve")));el("queue").querySelectorAll(".rejectBtn").forEach(b=>b.addEventListener("click",()=>review(b.closest(".card"),"reject")));}
async function review(card,decision){const id=Number(card.dataset.id),checked=card.querySelector(".sourceChecked").checked,op=card.querySelector(".operation").value,note=card.querySelector(".reviewNote").value.trim();if(decision==="approve"&&!checked){showMessage(tr("sourceRequired"),"error");card.querySelector(".sourceChecked").focus();return;}if(decision==="approve"&&!card.querySelector(".refs a")&&note.length===0){showMessage(tr("sourceNone"),"error");card.querySelector(".reviewNote").focus();return;}const buttons=card.querySelectorAll("button");buttons.forEach(b=>b.disabled=true);showMessage(tr("working"));const {data,error}=await sb.rpc("sd_review_listing_suggestion",{p_suggestion_id:id,p_decision:decision,p_source_checked:checked,p_operating_status:op,p_review_note:note||null});buttons.forEach(b=>b.disabled=false);if(error){showMessage(tr("error")+" "+error.message,"error");return;}queueRows=queueRows.filter(x=>Number(x.id)!==id);showMessage(tr(decision==="approve"?"approved":"rejected"),"success");renderQueue();await loadQueue();}
(async()=>{const {data}=await sb.auth.getSession();if(data.session?.user)await enterReviewer(data.session.user);applyLang();})();
</script>
</body>
</html>
