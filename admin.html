s checked.",editDetails:"Edit details before approval",saveEdits:"Save edits",saved:"Edits saved to the review queue.",nameAr:"Name in Arabic",nameEn:"Name in English",localityEn:"Locality in English",imageUrl:"Photo URL",photoRightsLabel:"Confirm photo publication rights",photoMethod:"Photo method",photoUrlOption:"Image link",uploadFileOption:"Upload file",photoUrlLabel:"Photo URL",uploadPhoto:"Upload a photo from your device",photoLimit:"JPG, PNG, or WebP, up to 5 MB",photoPreview:"Photo preview"}

const tr=k=>t[lang][k]||k;
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function safeUrl(v){try{const u=new URL(v);return ["https:","http:"].includes(u.protocol)?u.href:"";}catch{return "";}}
function textLink(label,url){const u=safeUrl(url);return u?'<a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+esc(label)+'</a>':"";}
function applyLang(){document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";el("langBtn").textContent=lang==="ar"?"English":"العربية";el("pageTitle").textContent=lang==="ar"?"لوحة إدارة الدليل":"Directory admin";el("subtitle").textContent=lang==="ar"?"راجع المقترحات، عدّلها، ثم اعتمدها لنشرها للعامة.":"Review, edit, and approve suggestions to publish them.";el("queueTitle").textContent=tr("queue");el("signOut").textContent=tr("logout");renderQueue();}
el("langBtn").addEventListener("click",()=>{lang=lang==="ar"?"en":"ar";applyLang();});
el("year").textContent=new Date().getFullYear();

el("signOut").addEventListener("click",async()=>{await sb.auth.signOut();location.replace("./login.html");});
sb.auth.onAuthStateChange((_event,session)=>{if(!session?.user){signedUser=null;location.replace("./login.html");return;}setTimeout(()=>enterReviewer(session.user),0);});
async function enterReviewer(user){if(signedUser===user.id)return;signedUser=user.id;const {data,error}=await sb.from("sd_directory_admins").select("user_id").eq("user_id",user.id).maybeSingle();if(error||!data){signedUser=null;await sb.auth.signOut();location.replace("./login.html?error=unauthorized");return;}el("queuePanel").classList.remove("hidden");el("signOut").classList.remove("hidden");showMessage(tr("loading"));await loadQueue();}
function showMessage(message,kind=""){el("pageMessage").className=kind?"message "+kind:"";el("pageMessage").textContent=message;}
async function loadQueue(){const [cats,sugs]=await Promise.all([sb.from("sd_categories").select("*"),sb.from("sd_listing_suggestions").select("*").eq("status","pending").order("created_at",{ascending:true})]);if(cats.error||sugs.error){showMessage(tr("error"),"error");return false;}categories=new Map((cats.data||[]).map(c=>[String(c.id),c]));queueRows=sugs.data||[];el("queueCount").textContent=queueRows.length+" "+tr("count");showMessage("");renderQueue();return true;}
function valLabel(k,v){return '<div class="detail"><strong>'+esc(tr(k))+':</strong> <span>'+esc(v||"—")+'</span></div>';}
function categoryName(id){const c=categories.get(String(id));if(!c)return id||"—";return lang==="en"?(c.name_en||c.name_ar):(c.name_ar||c.name_en);}
function editControl(key,label,value,type="text"){return '<label>'+esc(label)+'<input class="editField" data-edit="'+esc(key)+'" type="'+type+'" value="'+esc(value||"")+'"></label>';}
function renderEdit(s){const catOptions=['<option value="">—</option>',...Array.from(categories.values()).map(c=>'<option value="'+esc(c.id)+'" '+(String(c.id)===String(s.category_id)?"selected":"")+'>'+esc(lang==="en"?(c.name_en||c.name_ar):c.name_ar)+'</option>')].join("");const stateOptions=['<option value="">—</option>',...directoryStates.map(([ar,en])=>'<option value="'+esc(ar)+'" '+(ar===s.state_ar?"selected":"")+'>'+esc(lang==="en"?en:ar)+'</option>')].join("");return '<details class="editBox"><summary>'+esc(tr("editDetails"))+'</summary><div class="editGrid">'+editControl("name_ar",tr("nameAr"),s.name_ar)+editControl("name_en",tr("nameEn"),s.name_en)+editControl("facility_type_ar",tr("type"),s.facility_type_ar)+ '<label>'+esc(tr("category"))+'<select class="editField" data-edit="category_id">'+catOptions+'</select></label><label>'+esc(tr("state"))+'<select class="editField" data-edit="state_ar">'+stateOptions+'</select></label>'+editControl("locality_ar",tr("locality"),s.locality_ar)+editControl("locality_en",tr("localityEn"),s.locality_en)+editControl("address_ar",tr("address"),s.address_ar)+editControl("phone_public",tr("phone"),s.phone_public,"tel")+editControl("whatsapp_public",tr("whatsapp"),s.whatsapp_public,"tel")+editControl("website_url",tr("website"),s.website_url,"url")+editControl("working_hours",tr("hours"),s.working_hours)+editControl("map_url",tr("map"),s.map_url,"url")+editControl("source_url",tr("source"),s.source_url,"url")+'<label>'+esc(tr("photoMethod"))+'<select class="imageMode"><option value="url">'+esc(tr("photoUrlOption"))+'</option><option value="file">'+esc(tr("uploadFileOption"))+'</option></select></label><div class="photoUrlWrap">'+editControl("image_url",tr("photoUrlLabel"),s.image_url,"url")+'</div><div class="photoFileWrap" hidden><label class="photoFileLabel">'+esc(tr("uploadPhoto"))+'<input class="photoFile" type="file" accept="image/jpeg,image/png,image/webp"><small class="photoFileHint">'+esc(tr("photoLimit"))+'</small><img class="editPhotoPreview" src="'+esc(safeUrl(s.image_url))+'" alt="'+esc(tr("photoPreview"))+'" '+(safeUrl(s.image_url)?"":"hidden")+'></label></div>'+editControl("image_credit",tr("credit"),s.image_credit)+editControl("image_source_url",tr("photoSource"),s.image_source_url,"url")+'<label class="editRights"><input class="editField" data-edit="image_rights_confirmed" type="checkbox" '+(s.image_rights_confirmed?"checked":"")+'><span>'+esc(tr("photoRightsLabel"))+'</span></label></div><button class="btn saveEditBtn" type="button">'+esc(tr("saveEdits"))+'</button></details>';}
function renderQueue(){if(!el("queue")||el("queuePanel").classList.contains("hidden"))return;el("queue").innerHTML="";if(!queueRows.length){el("queue").innerHTML='<div class="empty">'+esc(tr("none"))+'</div>';el("queueCount").textContent="0 "+tr("count");return;}el("queue").innerHTML=queueRows.map(s=>{const image=safeUrl(s.image_url);const status=s.operating_status||"unknown";const options=[["unknown",tr("unknown")],["open",tr("open")],["temporarily_closed",tr("temp")],["closed",tr("closed")]].map(([v,l])=>'<option value="'+v+'" '+(v===status?"selected":"")+'>'+esc(l)+'</option>').join("");const img=image?'<img class="photo" src="'+esc(image)+'" alt="'+esc(s.name_ar)+'">':"";const rights=s.image_url&&!s.image_rights_confirmed?'<p class="message error">'+esc(tr("photoRights"))+'</p>':"";const sourceLinks=textLink(tr("source"),s.source_url)+textLink(tr("map"),s.map_url)+textLink(tr("website"),s.website_url)+textLink(tr("photoSource"),s.image_source_url);return '<article class="card" data-id="'+esc(s.id)+'" data-has-source="'+(!!safeUrl(s.source_url))+'"><span class="badge">'+esc(categoryName(s.category_id))+'</span><h3>'+esc(s.name_ar)+(lang==="en"&&s.name_en?" <small>("+esc(s.name_en)+")</small>":"")+'</h3><div class="details">'+valLabel("type",s.facility_type_ar)+valLabel("state",s.state_ar)+valLabel("locality",s.locality_ar+(s.locality_en?" / "+s.locality_en:""))+valLabel("address",s.address_ar)+valLabel("phone",s.phone_public)+valLabel("whatsapp",s.whatsapp_public)+valLabel("website",s.website_url)+valLabel("hours",s.working_hours)+valLabel("submitter",s.submitter_name)+valLabel("contact",s.submitter_contact)+valLabel("credit",s.image_credit)+'</div>'+img+rights+'<div class="refs">'+sourceLinks+'</div>'+renderEdit(s)+'<div class="review"><label class="check"><input class="sourceChecked" type="checkbox"><span>'+esc(tr("sourceCheck"))+'</span></label><label>'+esc(tr("operation"))+'<select class="operation">'+options+'</select></label><label style="grid-column:1/-1">'+esc(tr("note"))+'<textarea class="reviewNote" placeholder="'+esc(s.source_url?"":"")+'"></textarea></label><div class="cardActions"><button class="btn approve approveBtn" type="button">'+esc(tr("approve"))+'</button><button class="btn reject rejectBtn" type="button">'+esc(tr("reject"))+'</button></div></div></article>';}).join("");el("queue").querySelectorAll(".approveBtn").forEach(b=>b.addEventListener("click",()=>review(b.closest(".card"),"approve")));el("queue").querySelectorAll(".rejectBtn").forEach(b=>b.addEventListener("click",()=>review(b.closest(".card"),"reject")));el("queue").querySelectorAll(".saveEditBtn").forEach(b=>b.addEventListener("click",()=>saveEdits(b.closest(".card"),b)));el("queue").querySelectorAll(".photoFile").forEach(input=>input.addEventListener("change",()=>previewAdminPhoto(input)));el("queue").querySelectorAll(".imageMode").forEach(input=>{setPhotoMode(input.closest(".card"));input.addEventListener("change",()=>setPhotoMode(input.closest(".card")));});}
function setPhotoMode(card){const mode=card.querySelector(".imageMode")?.value||"url";const urlWrap=card.querySelector(".photoUrlWrap"),fileWrap=card.querySelector(".photoFileWrap");if(urlWrap)urlWrap.hidden=mode!=="url";if(fileWrap)fileWrap.hidden=mode!=="file";}
function previewAdminPhoto(input){const file=input.files?.[0],preview=input.closest(".photoFileLabel").querySelector(".editPhotoPreview");if(!file){preview.hidden=true;return;}if(!["image/jpeg","image/png","image/webp"].includes(file.type)||file.size>5242880){input.value="";preview.hidden=true;showMessage(lang==="en"?"Choose a JPG, PNG, or WebP image no larger than 5 MB.":"اختر صورة JPG أو PNG أو WebP لا يتجاوز حجمها 5 ميغابايت.","error");return;}preview.src=URL.createObjectURL(file);preview.hidden=false;}
async function uploadAdminPhoto(card,fields){const mode=card.querySelector(".imageMode")?.value||"url";const file=card.querySelector(".photoFile")?.files?.[0];if(mode!=="file")return true;if(!file){showMessage(lang==="en"?"Choose an image file to upload.":"اختر ملف صورة لرفعه.","error");return false;}if(!["image/jpeg","image/png","image/webp"].includes(file.type)||file.size>5242880){showMessage(lang==="en"?"Choose a JPG, PNG, or WebP image no larger than 5 MB.":"اختر صورة JPG أو PNG أو WebP لا يتجاوز حجمها 5 ميغابايت.","error");return false;}if(!fields.image_rights_confirmed){showMessage(tr("photoRights"),"error");card.querySelector('[data-edit="image_rights_confirmed"]').focus();return false;}const ext=file.type==="image/png"?"png":file.type==="image/webp"?"webp":"jpg";const token=crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2);const path="pending/admin-"+token+"."+ext;const {error}=await sb.storage.from("sd-directory-photos").upload(path,file,{contentType:file.type,upsert:false});if(error){showMessage(tr("error")+" "+error.message,"error");return false;}fields.image_url=sb.storage.from("sd-directory-photos").getPublicUrl(path).data.publicUrl;return true;}
function collectEditFields(card){const fields={};card.querySelectorAll(".editField").forEach(input=>{fields[input.dataset.edit]=input.type==="checkbox"?input.checked:input.value.trim();});return fields;}
async function saveEdits(card,button){const fields=collectEditFields(card);if(fields.name_ar.length<2||!fields.category_id||!fields.state_ar){showMessage(lang==="en"?"Arabic name, directory, and state are required.":"الاسم العربي والدليل والولاية مطلوبة.","error");return;}button.disabled=true;showMessage(tr("working"));if(!await uploadAdminPhoto(card,fields)){button.disabled=false;return;}const {error}=await sb.rpc("sd_update_listing_suggestion",{p_suggestion_id:Number(card.dataset.id),p_fields:fields});button.disabled=false;if(error){showMessage(tr("error")+" "+error.message,"error");return;}await loadQueue();showMessage(tr("saved"),"success");}
async function review(card,decision){const id=Number(card.dataset.id),checked=card.querySelector(".sourceChecked").checked,op=card.querySelector(".operation").value,note=card.querySelector(".reviewNote").value.trim();if(decision==="approve"&&!checked){showMessage(tr("sourceRequired"),"error");card.querySelector(".sourceChecked").focus();return;}const fields=decision==="approve"?collectEditFields(card):null;if(decision==="approve"&&(!fields.name_ar||fields.name_ar.length<2||!fields.category_id||!fields.state_ar)){showMessage(lang==="en"?"Arabic name, directory, and state are required.":"الاسم العربي والدليل والولاية مطلوبة.","error");return;}if(decision==="approve"&&!safeUrl(fields.source_url)&&note.length===0){showMessage(tr("sourceNone"),"error");card.querySelector(".reviewNote").focus();return;}const buttons=card.querySelectorAll("button");buttons.forEach(b=>b.disabled=true);showMessage(tr("working"));if(fields){if(!await uploadAdminPhoto(card,fields)){buttons.forEach(b=>b.disabled=false);return;}const edited=await sb.rpc("sd_update_listing_suggestion",{p_suggestion_id:id,p_fields:fields});if(edited.error){buttons.forEach(b=>b.disabled=false);showMessage(tr("error")+" "+edited.error.message,"error");return;}}const {error}=await sb.rpc("sd_review_listing_suggestion",{p_suggestion_id:id,p_decision:decision,p_source_checked:checked,p_operating_status:op,p_review_note:note||null});buttons.forEach(b=>b.disabled=false);if(error){showMessage(tr("error")+" "+error.message,"error");return;}queueRows=queueRows.filter(x=>Number(x.id)!==id);renderQueue();const refreshed=await loadQueue();if(refreshed)showMessage(tr(decision==="approve"?"approved":"rejected"),"success");}
(async()=>{const {data}=await sb.auth.getSession();applyLang();if(!data.session?.user){location.replace("./login.html");return;}await enterReviewer(data.session.user);})();
</script>
